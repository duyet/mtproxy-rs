# MTProxy-RS Configuration Example
#
# This file demonstrates all available configuration options.
# Copy this file to your desired location and customize as needed.

# Default datacenter ID (required)
default 2

# Telegram server endpoints (required)
# Format: proxy_for <dc_id> <ip>:<port>
# These are official Telegram servers - update from https://core.telegram.org/getProxyConfig
proxy_for 1 149.154.175.50:443
proxy_for 2 149.154.167.51:443
proxy_for 3 149.154.175.100:443
proxy_for 4 149.154.167.91:443
proxy_for 5 91.108.56.190:443

# Connection Limits
# Maximum number of simultaneous connections across all workers
max_global_connections 1000

# Maximum connections allowed per IP address
max_connections_per_ip 100

# Timeouts (in seconds)
# Timeout for reading data from client connections
read_timeout 300

# Connection Management
# Interval for cleaning up dead connections (in seconds)
cleanup_interval 60

# Telegram Server Connection
# Timeout for server operations (milliseconds)
timeout 5000

# Minimum/maximum connections to maintain with Telegram servers
min_connections 1
max_connections 10

# Security Note:
# - Run the proxy with --user option to drop privileges
# - Use --stats-token to protect the stats endpoint
# - Monitor authentication_failures metric for attacks
# - Adjust max_connections_per_ip based on your use case

# Example usage:
# ./mtproxy-rs -S $(openssl rand -hex 16) \
#   --user mtproxy \
#   --stats-token $(openssl rand -hex 32) \
#   --http-stats \
#   config.conf
